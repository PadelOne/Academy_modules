function importPlayersCSV() {
  openModal('Importer des joueurs (CSV / Excel)', `<p class="small">Exportez votre fichier Excel en CSV. Colonnes reconnues (première ligne) : <b>Prénom, Nom, E-mail, Téléphone, Date de naissance, Club, Niveau</b>. Séparateur ; ou ,</p>
    <input type="file" id="csvfile" accept=".csv,text/csv"><div class="hint mt">Les doublons (même e-mail, téléphone ou nom) sont ignorés et listés.</div>`, {
    submit: () => {
      const f = document.getElementById('csvfile').files[0]; if (!f) { toast('Choisissez un fichier.', 'error'); return false; }
      const rd = new FileReader(); rd.onload = () => {
        const lines = rd.result.replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim());
        const sep = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ';' : ',';
        const head = lines[0].split(sep).map(h => norm(h).replace(/[^a-z]/g, ''));
        const idx = k => head.findIndex(h => k.some(x => h.startsWith(x)));
        const ix = { fn: idx(['prenom', 'firstname']), ln: idx(['nom', 'lastname']), em: idx(['email', 'mail']), ph: idx(['tel', 'phone', 'portable', 'mobile']), bd: idx(['datedenaissance', 'naissance', 'birth']), cl: idx(['club']), lv: idx(['niveau', 'level']) };
        let added = 0; const skipped = [];
        lines.slice(1).forEach(l => {
          const c = l.split(sep).map(x => x.replace(/^"|"$/g, '').trim());
          const d = { firstName: c[ix.fn] || '', lastName: c[ix.ln] || '', email: c[ix.em] || '', phone: c[ix.ph] || '' };
          if (!d.firstName && !d.lastName) return;
          if (findDuplicates(d).length) { skipped.push(d.firstName + ' ' + d.lastName); return; }
          const club = all('clubs').find(x => ix.cl >= 0 && norm(x.name).includes(norm(c[ix.cl] || '#')));
          const lv = ix.lv >= 0 ? parseFloat(String(c[ix.lv]).replace(',', '.')) : NaN;
          upsert('players', { id: uid('pl'), ...d, birthDate: ix.bd >= 0 ? c[ix.bd] : '', clubId: club?.id || all('clubs')[0]?.id, levelEstimated: null, levelQuiz: null, levelValidated: isNaN(lv) ? null : Math.max(1, Math.min(10, lv)), emailConsent: true, source: 'import' });
          added++;
        });
        logAudit('Import CSV de joueurs', `${added} ajoutés, ${skipped.length} doublons ignorés`, 'players', ''); saveDB(); render();
        openModal('Import terminé', `<p><b>${added}</b> joueur(s) ajouté(s).</p>${skipped.length ? `<div class="callout warn">${skipped.length} doublon(s) ignoré(s) : ${esc(skipped.join(', '))}</div>` : ''}`, { footer: '<button type="button" class="btn pri" onclick="closeModal()">Fermer</button>' });
      }; rd.readAsText(f); return false;
    }, submitLabel: 'Importer'
  });
}

function resetToEmpty() {
  confirmBox('Repartir d’une base vide', `<div class="callout danger">Tous les joueurs, modules, groupes, inscriptions, paiements, présences et e-mails de cet appareil seront supprimés.</div><p class="small">Conservés : clubs, terrains, coachs, équipe, règles, niveaux, fermetures et modèles d’e-mails. Pensez à corriger le coach « Coach B (exemple) » et les adresses des clubs.</p>`, () => {
    const keep = { clubs: DB.clubs.filter(x => !x.deleted), coaches: DB.coaches.filter(x => !x.deleted), users: DB.users.filter(x => !x.deleted), templates: DB.templates, settings: DB.settings };
    DB = emptyDB(); Object.assign(DB, keep); DB.meta.demo = false; migrate(DB);
    logAudit('Base réinitialisée', 'Démarrage avec des données réelles', 'db', ''); saveDB(); toast('Base vide prête. Créez vos modules.');
  }, 'Tout effacer', true);
}
function erasePlayer(id) {
  if (!id) return; const p = get('players', id);
  const nm = playerName(p);
  confirmBox('Effacer définitivement', `<p>Effacer <b>${esc(playerName(p))}</b> et toutes ses données (inscriptions, paiements, présences, notes, e-mails) ? Les montants encaissés disparaîtront des statistiques.</p>`, () => {
    ['registrations', 'payments', 'attendance', 'notes', 'evaluations', 'outbox'].forEach(c => DB[c].filter(x => x.playerId === id).forEach(x => { Object.keys(x).forEach(k => { if (!['id', 'updatedAt'].includes(k)) delete x[k]; }); x.deleted = true; x.updatedAt = nowISO(); }));
    const pl = DB.players.find(x => x.id === id); Object.keys(pl).forEach(k => { if (!['id'].includes(k)) delete pl[k]; }); pl.deleted = true; pl.updatedAt = nowISO();
    DB.audit.forEach(a => { if (a.detail && a.detail.includes(nm)) a.detail = a.detail.split(nm).join('[joueur effacé]'); });
    logAudit('Données personnelles effacées', 'Droit à l’effacement (LPD)', 'players', id); saveDB(); toast('Joueur effacé.');
  }, 'Effacer', true);
}
